services:
  db:
    image: postgres:16-alpine
    container_name: hotelbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotelbooking}
      POSTGRES_USER: ${POSTGRES_USER:-app_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./seed:/seed:ro
      # init-db.sh is picked up automatically by the postgres entrypoint
      # convention and runs once, the first time the volume is created.
      # It applies /migrations/*.sql then /seed/*.sql in filename order.
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_admin} -d ${POSTGRES_DB:-hotelbooking}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
